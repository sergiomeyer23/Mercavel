name: Coletar preços

# todo dia de manhã (horário de Brasília) e também sob demanda. minuto quebrado porque na hora cheia
# o agendamento do Actions atrasa horas.
# cada mercado é varrido num job separado (por categoria, dentro do script) e o montar junta tudo
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

# menor privilegio: so o job montar escreve no repositorio
permissions:
  contents: read

# duas coletas ao mesmo tempo disputariam o push
concurrency:
  group: coletar-precos
  cancel-in-progress: false

jobs:
  varrer:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # o Atacadão tem 90 categorias e ~56 mil produtos: dividido em 4 fatias que rodam juntas
        include:
          - { mercado: muffato, parte: '1/1', nome: muffato }
          - { mercado: festval, parte: '1/1', nome: festval }
          - { mercado: atacadao, parte: '1/4', nome: atacadao-1 }
          - { mercado: atacadao, parte: '2/4', nome: atacadao-2 }
          - { mercado: atacadao, parte: '3/4', nome: atacadao-3 }
          - { mercado: atacadao, parte: '4/4', nome: atacadao-4 }
          # lojas Mercafacil: um job cada (Irani com fallback nas ofertas do dia se o site bloquear o Actions)
          - { mercado: irani, parte: '1/1', nome: irani }
          - { mercado: riviera, parte: '1/1', nome: riviera }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # valores da matrix passam por env: nada de ${{ }} dentro do script do shell
      - name: Varrer
        env:
          MERCADO: ${{ matrix.mercado }}
          PARTE: ${{ matrix.parte }}
        run: node scripts/varrer-catalogo.mjs --mercado "$MERCADO" --parte "$PARTE"
      # sobe o que deu pra coletar mesmo se a varredura falhou no meio
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: catalogo-${{ matrix.nome }}
          path: dados/catalogo
          retention-days: 1
          if-no-files-found: warn

  montar:
    needs: varrer
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # cada artefato traz dados/catalogo/<mercado>/*.json; juntos viram a pasta completa.
      # sem nenhum artefato o download falha: o montar roda assim mesmo e recusa a base vazia com mensagem clara
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: dados/catalogo
          pattern: catalogo-*
          merge-multiple: true
      - name: Conferir o que chegou
        run: |
          mkdir -p dados/catalogo
          find dados/catalogo -name '*.json' | cut -d/ -f3 | sort | uniq -c
      - run: node scripts/montar-base.mjs
      - name: Gravar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data dados/casamentos-por-nome.json
          if git diff --cached --quiet; then
            echo "nada mudou"
          else
            git commit -m "chore: atualiza preços coletados"
            # outro commit pode ter entrado durante a coleta: reaplica por cima e tenta de novo
            for tentativa in 1 2 3; do
              git pull --rebase origin "$GITHUB_REF_NAME" && git push && exit 0
              echo "push falhou (tentativa $tentativa/3)"; sleep $((tentativa * 5))
            done
            exit 1
          fi
