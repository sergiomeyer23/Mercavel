<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#219f5b" />
    <meta
      name="description"
      content="Mercavel: comparador de preços de supermercados de Cascavel (PR). Veja em qual mercado a sua cesta sai mais barata e de onde vem cada preço."
    />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Mercavel - Compare preços de supermercados em Cascavel (PR)" />
    <meta
      property="og:description"
      content="Veja em qual mercado a sua cesta sai mais barata, com a data e o link de cada preço."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />
    <title>Mercavel - Compare preços de supermercados em Cascavel (PR)</title>
  </head>

    <script type="module" src="/src/main.tsx"></script>

</html>
